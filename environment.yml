name: dscript

channels:
  - pytorch
  - conda-forge

dependencies:
  - python>=3.10
  - pip
  - pytorch::pytorch>=2.6
  - pytorch::pytorch-cuda=12.1
  - biotite==1.2.0
  - h5py
  - huggingface_hub>=1.5.0
  - matplotlib
  - numpy
  - pandas
  - scikit-learn
  - scipy
  - seaborn
  - setuptools
  - tqdm
  - loguru
  - pip:
    - transformers
    - sentencepiece
    - tiktoken
    - safetensors
    - -e .
